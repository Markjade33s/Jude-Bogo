
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Dodging Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      overflow: hidden;
    }

    /* TAAS: Safe zone para sa Header at Static Button */
    .header-zone {
      padding: 30px 20px 10px;
      text-align: center;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      z-index: 10; /* Para laging nasa ibabaw */
    }

    h1 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #333;
    }

    .btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-static {
      background-color: #4CAF50;
      color: white;
    }

    /* BABA: Playing zone para sa Dodging Button */
    .play-zone {
      flex: 1;
      position: relative;
      width: 100%;
    }

    .btn-dodge {
      position: absolute;
      background-color: #f44336;
      color: white;
      transition: all 0.15s ease-out;
      white-space: nowrap;
      touch-action: none; /* Pigilan ang scroll kapag tinatangkang i-tap sa CP */
    }

    /* Pop-up Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      max-width: 85%;
    }

    .modal-content p {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }

    .close-btn {
      background-color: #2196F3;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- SAFE ZONE: Hindi pwedeng pasukin ng dodging button -->
  <div class="header-zone">
    <h1>Kupal kaba jude???</h1>
    <button id="staticBtn" class="btn btn-static">Dati</button>
  </div>

  <!-- PLAY ZONE: Dito lang pwedeng gumalaw ang dodging button -->
  <div id="playZone" class="play-zone">
    <button id="dodgeBtn" class="btn btn-dodge">Oulol</button>
  </div>

  <!-- Pop-up Modal Message -->
  <div id="messageModal" class="modal-overlay">
    <div class="modal-content">
      <p>Bitaw dong hulama ko 20k bi pang gas lang please</p>
      <button id="closeBtn" class="close-btn">Close</button>
    </div>
  </div>

  <script>
    const dodgeBtn = document.getElementById('dodgeBtn');
    const playZone = document.getElementById('playZone');
    const staticBtn = document.getElementById('staticBtn');
    const messageModal = document.getElementById('messageModal');
    const closeBtn = document.getElementById('closeBtn');

    // Ilagay ang dodging button sa gitna ng play-zone sa simula
    function setInitialPosition() {
      const zoneWidth = playZone.clientWidth;
      const zoneHeight = playZone.clientHeight;
      
      dodgeBtn.style.left = `${(zoneWidth / 2) - (dodgeBtn.offsetWidth / 2)}px`;
      dodgeBtn.style.top = `${(zoneHeight / 3)}px`;
    }

    function moveButton() {
      const padding = 15;
      
      // Kunin ang eksaktong laki ng playZone lamang
      const maxX = playZone.clientWidth - dodgeBtn.offsetWidth - padding;
      const maxY = playZone.clientHeight - dodgeBtn.offsetHeight - padding;

      // Mag-generate ng position sa LOOB LANG ng playZone
      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      dodgeBtn.style.left = `${randomX}px`;
      dodgeBtn.style.top = `${randomY}px`;
    }

    // Controls para sa Desktop at CP
    dodgeBtn.addEventListener('mouseover', moveButton);
    dodgeBtn.addEventListener('touchstart', (e) => {
      e.preventDefault(); // Iwasan ang pag-scroll o pag-zoom kapag tinatangkang i-tap
      moveButton();
    });
    dodgeBtn.addEventListener('click', moveButton);

    // Show at Close Modal
    staticBtn.addEventListener('click', () => {
      messageModal.style.display = 'flex';
    });

    closeBtn.addEventListener('click', () => {
      messageModal.style.display = 'none';
    });

    // Set-up paunang pwesto pagka-load
    window.addEventListener('load', setInitialPosition);
  </script>

</body>
</html>
